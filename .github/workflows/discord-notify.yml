name: Notify Discord

on:
  push:
  issues:
    types: [opened, edited, closed]
  pull_request:
    types: [opened, closed, merged]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Payload
        id: payload
        run: |
          echo 'EVENT_NAME=${{ github.event_name }}' >> $GITHUB_ENV
          echo 'ACTOR=${{ github.actor }}' >> $GITHUB_ENV
          echo 'REPO=${{ github.repository }}' >> $GITHUB_ENV
          echo 'REF=${{ github.ref_name }}' >> $GITHUB_ENV
          
          if [ "${{ github.event_name }}" == "push" ]; then
            echo 'TITLE=🚀 Push to branch' >> $GITHUB_ENV
            echo 'DESCRIPTION=A new push was made by **${{ github.actor }}**.' >> $GITHUB_ENV
            echo 'FIELD1_NAME=Branch' >> $GITHUB_ENV
            echo 'FIELD1_VALUE=${{ github.ref_name }}' >> $GITHUB_ENV
            echo 'FIELD2_NAME=Commit Message' >> $GITHUB_ENV
            echo 'FIELD2_VALUE=${{ github.event.head_commit.message }}' >> $GITHUB_ENV
            echo 'TIMESTAMP=${{ github.event.head_commit.timestamp }}' >> $GITHUB_ENV

          elif [ "${{ github.event_name }}" == "issues" ]; then
            echo 'TITLE=🐛 Issue Activity' >> $GITHUB_ENV
            echo 'DESCRIPTION=**${{ github.actor }}** ${{ github.event.action }} an issue.' >> $GITHUB_ENV
            echo 'FIELD1_NAME=Title' >> $GITHUB_ENV
            echo 'FIELD1_VALUE=${{ github.event.issue.title }}' >> $GITHUB_ENV
            echo 'FIELD2_NAME=Issue URL' >> $GITHUB_ENV
            echo 'FIELD2_VALUE=${{ github.event.issue.html_url }}' >> $GITHUB_ENV
            echo 'TIMESTAMP=${{ github.event.issue.updated_at }}' >> $GITHUB_ENV

          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            echo 'TITLE=📦 Pull Request Activity' >> $GITHUB_ENV
            echo 'DESCRIPTION=**${{ github.actor }}** ${{ github.event.action }} a pull request.' >> $GITHUB_ENV
            echo 'FIELD1_NAME=Title' >> $GITHUB_ENV
            echo 'FIELD1_VALUE=${{ github.event.pull_request.title }}' >> $GITHUB_ENV
            echo 'FIELD2_NAME=PR URL' >> $GITHUB_ENV
            echo 'FIELD2_VALUE=${{ github.event.pull_request.html_url }}' >> $GITHUB_ENV
            echo 'TIMESTAMP=${{ github.event.pull_request.updated_at }}' >> $GITHUB_ENV
          fi

      - name: Send Discord Webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{
              \"embeds\": [
                {
                  \"title\": \"${TITLE}\",
                  \"description\": \"${DESCRIPTION}\",
                  \"color\": 3447003,
                  \"fields\": [
                    {
                      \"name\": \"${FIELD1_NAME}\",
                      \"value\": \"${FIELD1_VALUE}\"
                    },
                    {
                      \"name\": \"${FIELD2_NAME}\",
                      \"value\": \"${FIELD2_VALUE}\"
                    }
                  ],
                  \"timestamp\": \"${TIMESTAMP}\"
                }
              ]
            }" \
            $DISCORD_WEBHOOK_URL
